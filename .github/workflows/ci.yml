name: CI

on:
  push:
    branches: [main, refactor/three-tier-architecture, refactor/streamlit-fastapi-separation]
  pull_request:
    branches: [main, refactor/three-tier-architecture]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Compile Python files
        run: python -m compileall -q app.py main.py backend frontend training laptop_price tests
      - name: Ruff check
        run: python -m ruff check --select E4,E7,E9,F app.py main.py backend frontend training laptop_price tests
      - name: Run tests
        run: python -m pytest -q
